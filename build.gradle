// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
		google()
		mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
    }
}

allprojects {
    repositories {
		google()
		mavenCentral()
		maven { url 'https://raw.githubusercontent.com/saki4510t/libcommon/master/repository/' }
    }
}

tasks.register('clean', Delete) {
	delete rootProject.layout.buildDirectory
}

ext {
	appcompatVersion = '1.6.1'
	commonLibVersion= '2.12.4'
	versionCompiler = 37
	versionMin = 21
	// Must stay at 27 for Android 10 devices: there the USB service wrongly reports a missing
	// CAMERA permission for video class devices to any app targeting API 28+, so the device can never be opened.
	versionTarget = 27
	versionNameString = '1.0.0'
	javaSourceCompatibility = JavaVersion.VERSION_11
	javaTargetCompatibility = JavaVersion.VERSION_11
}
