apply plugin: 'com.android.application'

android {
	namespace 'com.serenegiant.usbcameratest0'
	compileSdk versionCompiler

	compileOptions {
		sourceCompatibility javaSourceCompatibility
		targetCompatibility javaTargetCompatibility
	}

    defaultConfig {
        applicationId "com.serenegiant.usbcameratest0"
        minSdk versionMin
		targetSdk versionTarget
		versionCode 8
		versionName "3.00"
    }

	// the release key is configured in local.properties:
	// release.storeFile, release.storePassword, release.keyAlias, release.keyPassword
	def localProps = new Properties()
	def localPropsFile = rootProject.file('local.properties')
	if (localPropsFile.exists()) {
		localPropsFile.withInputStream { localProps.load(it) }
	}
	def hasReleaseKey = localProps.getProperty('release.storeFile') != null

	signingConfigs {
		if (hasReleaseKey) {
			release {
				storeFile file(localProps.getProperty('release.storeFile'))
				storePassword localProps.getProperty('release.storePassword')
				keyAlias localProps.getProperty('release.keyAlias')
				keyPassword localProps.getProperty('release.keyPassword')
			}
		}
	}

    buildTypes {
        release {
			// the native code looks up Java classes, fields and methods by name
            minifyEnabled false
			if (hasReleaseKey) {
				signingConfig signingConfigs.release
			}
        }
    }
}

dependencies {
	implementation "androidx.appcompat:appcompat:${appcompatVersion}"

	implementation("com.serenegiant:common:${commonLibVersion}") {
		exclude module: 'support-v4'
	}
	implementation project(':libuvccamera')
}
